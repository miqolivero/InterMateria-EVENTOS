x-api: &api
  build:
    context: ./api-eventos
  restart: unless-stopped
  environment:
    PORT: 3000
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en api-eventos/.env}
    DB_NAME: eventos
    FRONT_URL: ${FRONT_URL:-http://localhost}
    JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en api-eventos/.env}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - eventos

x-frontend: &frontend
  build:
    context: ./front-eventos
    args:
      VITE_API_URL: /api
  restart: unless-stopped
  networks:
    - eventos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en api-eventos/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api-eventos/database/empresas.sql:/docker-entrypoint-initdb.d/01-empresas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventos

  api-1:
    <<: *api
  api-2:
    <<: *api
  api-3:
    <<: *api

  frontend-1:
    <<: *frontend
  frontend-2:
    <<: *frontend
  frontend-3:
    <<: *frontend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - frontend-1
      - frontend-2
      - frontend-3
    networks:
      - eventos

volumes:
  postgres_data:

networks:
  eventos:
    driver: bridge
